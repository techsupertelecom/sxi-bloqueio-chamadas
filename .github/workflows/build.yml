name: Build APK e Deploy na SXI Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [ build-app ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK (debug, assinado com chave debug)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SXI_BloqueioChamadas.apk
          ls -lh dist/

      - name: Publicar artefato no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SXI_BloqueioChamadas
          path: dist/SXI_BloqueioChamadas.apk

      - name: Deploy do APK no FTP da SXI (store.sxi.com.br)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          curl --fail --ssl-reqd -T dist/SXI_BloqueioChamadas.apk \
            "ftp://${FTP_HOST}/public_html/apk/SXI_BloqueioChamadas.apk" \
            --user "${FTP_USER}:${FTP_PASS}" \
          || curl --fail -T dist/SXI_BloqueioChamadas.apk \
            "ftp://${FTP_HOST}/public_html/apk/SXI_BloqueioChamadas.apk" \
            --user "${FTP_USER}:${FTP_PASS}"
          echo "APK enviado para https://www.sxi.com.br/apk/SXI_BloqueioChamadas.apk"
